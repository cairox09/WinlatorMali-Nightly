name: Sync Winlator Mali builds

on:
  workflow_dispatch:

  schedule:
    - cron: "37 * * * *"

  push:
    branches:
      - main
    paths:
      - ".github/workflows/sync.yml"

permissions:
  contents: write

concurrency:
  group: sync-winlator-mali-builds
  cancel-in-progress: true

env:
  UPSTREAM_REPO: GunaCharanTeja/WinlatorMali
  UPSTREAM_BRANCH: bionic-mali-1.0
  UPSTREAM_WORKFLOW: .github/workflows/build-apk.yml
  RELEASE_TAG: nightly

jobs:
  sync:
    name: Mirror Winlator Mali APKs
    runs-on: ubuntu-latest

    steps:
      - name: Synchronize upstream builds
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}

        run: |
          set -euo pipefail

          api_get() {
            curl \
              --fail \
              --silent \
              --show-error \
              --location \
              --retry 3 \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2026-03-10" \
              "$1"
          }

          echo "Scanning ${UPSTREAM_REPO}..."

          RAW="$(
            api_get \
              "https://api.github.com/repos/${UPSTREAM_REPO}/actions/artifacts?per_page=100"
          )"

          # Pega o artifact mais novo de CADA tipo.
          #
          # Exemplos:
          # winlator-mali-antutu-release
          # winlator-mali-standard-release
          # winlator-mali-ludashi-release
          # winlator-mali-all-release
          # winlator-mali-standard-debug
          ARTIFACTS="$(
            jq -c \
              --arg branch "${UPSTREAM_BRANCH}" '
                [
                  .artifacts[]
                  | select(.expired == false)
                  | select(.workflow_run.head_branch == $branch)
                  | select(
                      .name
                      | test("^winlator-mali-.+-(debug|release)$")
                    )
                ]
                | sort_by(.name, .created_at)
                | group_by(.name)
                | map(max_by(.created_at))
                | sort_by(.created_at)
              ' <<< "${RAW}"
          )"

          COUNT="$(jq 'length' <<< "${ARTIFACTS}")"

          echo "Artifact channels found: ${COUNT}"

          if [[ "${COUNT}" -eq 0 ]]; then
            echo "::error::No Winlator Mali APK artifacts found."
            exit 1
          fi

          OLD_BODY="$(
            gh release view "${RELEASE_TAG}" \
              --json body \
              --jq '.body' \
              2>/dev/null || true
          )"

          mkdir -p assets downloads

          : > new-markers.txt
          : > new-builds.txt

          NEW_COUNT=0

          while IFS= read -r ARTIFACT; do
            [[ -z "${ARTIFACT}" ]] && continue

            ID="$(jq -r '.id' <<< "${ARTIFACT}")"
            NAME="$(jq -r '.name' <<< "${ARTIFACT}")"
            RUN_ID="$(jq -r '.workflow_run.id' <<< "${ARTIFACT}")"
            HEAD_SHA="$(jq -r '.workflow_run.head_sha' <<< "${ARTIFACT}")"
            CREATED_AT="$(jq -r '.created_at' <<< "${ARTIFACT}")"
            EXPECTED_DIGEST="$(jq -r '.digest // empty' <<< "${ARTIFACT}")"

            MARKER="<!-- upstream-artifact:${ID} -->"

            echo
            echo "Artifact: ${NAME}"
            echo "ID:       ${ID}"
            echo "Run:      ${RUN_ID}"

            if grep -Fq "${MARKER}" <<< "${OLD_BODY}"; then
              echo "Already mirrored."
              continue
            fi

            RUN="$(
              api_get \
                "https://api.github.com/repos/${UPSTREAM_REPO}/actions/runs/${RUN_ID}"
            )"

            CONCLUSION="$(jq -r '.conclusion' <<< "${RUN}")"
            WORKFLOW_PATH="$(jq -r '.path' <<< "${RUN}")"
            BRANCH="$(jq -r '.head_branch' <<< "${RUN}")"

            if [[ "${CONCLUSION}" != "success" ]]; then
              echo "Skipping unsuccessful run."
              continue
            fi

            if [[ "${WORKFLOW_PATH}" != "${UPSTREAM_WORKFLOW}" ]]; then
              echo "Skipping unexpected workflow."
              continue
            fi

            if [[ "${BRANCH}" != "${UPSTREAM_BRANCH}" ]]; then
              echo "Skipping unexpected branch."
              continue
            fi

            ZIP="downloads/${ID}.zip"

            echo "Downloading..."

            curl \
              --fail \
              --location \
              --silent \
              --show-error \
              --retry 5 \
              --retry-all-errors \
              --output "${ZIP}" \
              "https://nightly.link/${UPSTREAM_REPO}/actions/artifacts/${ID}.zip"

            test -s "${ZIP}"

            if [[ -n "${EXPECTED_DIGEST}" ]]; then
              ACTUAL_DIGEST="sha256:$(
                sha256sum "${ZIP}" | awk '{print $1}'
              )"

              echo "Expected: ${EXPECTED_DIGEST}"
              echo "Actual:   ${ACTUAL_DIGEST}"

              if [[ "${ACTUAL_DIGEST}" != "${EXPECTED_DIGEST}" ]]; then
                echo "::error::Artifact integrity check failed."
                exit 1
              fi
            fi

            mapfile -t APK_FILES < <(
              unzip -Z1 "${ZIP}" |
              grep -Ei '\.apk$' || true
            )

            if [[ "${#APK_FILES[@]}" -eq 0 ]]; then
              echo "::error::Artifact ${NAME} contains no APK."
              exit 1
            fi

            echo "APKs found: ${#APK_FILES[@]}"

            for APK_PATH in "${APK_FILES[@]}"; do
              BASE="$(basename "${APK_PATH}")"

              FLAVOR=""
              BUILD_TYPE=""

              if [[ "${BASE}" =~ ^app-(.+)-(debug|release)\.apk$ ]]; then
                FLAVOR="${BASH_REMATCH[1]}"
                BUILD_TYPE="${BASH_REMATCH[2]}"
              elif [[ "${NAME}" =~ ^winlator-mali-(.+)-(debug|release)$ ]]; then
                FLAVOR="${BASH_REMATCH[1]}"
                BUILD_TYPE="${BASH_REMATCH[2]}"

                if [[ "${FLAVOR}" == "all" ]]; then
                  FIRST_DIR="${APK_PATH%%/*}"

                  if [[ "${FIRST_DIR}" != "${APK_PATH}" ]]; then
                    FLAVOR="${FIRST_DIR}"
                  fi
                fi
              else
                FLAVOR="unknown"
                BUILD_TYPE="release"
              fi

              case "${FLAVOR,,}" in
                standard)
                  PRETTY="Standard"
                  ;;
                antutu)
                  PRETTY="Antutu"
                  ;;
                ludashi)
                  PRETTY="Ludashi"
                  ;;
                *)
                  PRETTY="$(
                    sed -E \
                      's/[^a-zA-Z0-9]+/-/g; s/^-//; s/-$//' \
                      <<< "${FLAVOR}"
                  )"
                  ;;
              esac

              if [[ "${BUILD_TYPE}" == "release" ]]; then
                OUTPUT="Winlator-Mali-${PRETTY}-Release.apk"
              else
                OUTPUT="Winlator-Mali-${PRETTY}-Debug.apk"
              fi

              echo "${APK_PATH}"
              echo "  -> ${OUTPUT}"

              unzip -p \
                "${ZIP}" \
                "${APK_PATH}" \
                > "assets/${OUTPUT}"

              if [[ ! -s "assets/${OUTPUT}" ]]; then
                echo "::error::Extracted APK is empty."
                exit 1
              fi

              (
                cd assets
                sha256sum "${OUTPUT}" > "${OUTPUT}.sha256"
              )
            done

            printf '%s\n' "${MARKER}" >> new-markers.txt

            printf '%s|%s|%s|%s|%s\n' \
              "${NAME}" \
              "${ID}" \
              "${RUN_ID}" \
              "${HEAD_SHA}" \
              "${CREATED_AT}" \
              >> new-builds.txt

            NEW_COUNT=$((NEW_COUNT + 1))

          done < <(jq -c '.[]' <<< "${ARTIFACTS}")

          echo
          echo "New artifacts: ${NEW_COUNT}"

          if [[ "${NEW_COUNT}" -eq 0 ]]; then
            echo "Everything is already up to date."
            exit 0
          fi

          echo
          echo "Assets prepared:"

          find assets \
            -maxdepth 1 \
            -type f \
            -printf '%f\n' |
            sort

          if ! gh release view "${RELEASE_TAG}" >/dev/null 2>&1; then
            gh release create "${RELEASE_TAG}" \
              --title "Winlator Mali Nightly Builds" \
              --notes "Initializing automated Actions mirror."
          fi

          mapfile -t FILES < <(
            find assets \
              -maxdepth 1 \
              -type f \
              -print |
              sort
          )

          gh release upload \
            "${RELEASE_TAG}" \
            "${FILES[@]}" \
            --clobber

          OLD_MARKERS="$(
            grep -oE \
              '<!-- upstream-artifact:[0-9]+ -->' \
              <<< "${OLD_BODY}" || true
          )"

          ALL_MARKERS="$(
            {
              printf '%s\n' "${OLD_MARKERS}"
              cat new-markers.txt
            } |
            sed '/^$/d' |
            sort -u
          )"

          {
            echo "# Winlator Mali Nightly Builds"
            echo
            echo "Automated mirror of APKs produced by:"
            echo
            echo "https://github.com/${UPSTREAM_REPO}"
            echo
            echo "Branch: \`${UPSTREAM_BRANCH}\`"
            echo
            echo "The APKs are extracted from the upstream GitHub Actions artifacts."
            echo
            echo "**They are not modified, rebuilt, or re-signed.**"
            echo
            echo "SHA-256 checksum files are provided beside every APK."
            echo
            echo "## Available APKs"
            echo

            gh release view "${RELEASE_TAG}" \
              --json assets \
              --jq '.assets[].name' |
              grep -Ei '\.apk$' |
              sort |
              sed 's/^/- `/' |
              sed 's/$/`/'

            echo
            echo "## Latest synchronization"
            echo

            while IFS='|' read -r \
              NAME ID RUN_ID HEAD_SHA CREATED_AT
            do
              SHORT_SHA="${HEAD_SHA:0:12}"

              echo "- \`${NAME}\`"
              echo "  - Artifact: \`${ID}\`"
              echo "  - Run: https://github.com/${UPSTREAM_REPO}/actions/runs/${RUN_ID}"
              echo "  - Commit: \`${SHORT_SHA}\`"
              echo "  - Created: ${CREATED_AT}"
            done < new-builds.txt

            echo
            printf '%s\n' "${ALL_MARKERS}"

          } > release-notes.md

          gh release edit "${RELEASE_TAG}" \
            --title "Winlator Mali Nightly Builds" \
            --notes-file release-notes.md

          echo
          echo "Synchronization complete."
